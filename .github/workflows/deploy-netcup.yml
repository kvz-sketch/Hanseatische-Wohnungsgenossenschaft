# Builds the site and uploads dist/ to netcup Webhosting over FTPS (lftp).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      FTP host, e.g. the domain or the hostingXXXXXX.netcup.net host
#   FTP_USERNAME    FTP user created in the netcup WCP (Plesk)
#   FTP_PASSWORD    password of that FTP user
# Optional:
#   FTP_SERVER_DIR  target folder on the server, ending in "/" (default: /httpdocs/)
#
# Until FTP_SERVER is set, the workflow only builds and skips the upload.

name: Deploy to netcup

on:
  push:
    branches:
      - claude/gerlach-gig-website-recreation-szelo7
  workflow_dispatch:

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install lftp
        if: env.FTP_SERVER != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Assets are uploaded before index.html so the live page never points at
      # missing files; stale hashed assets are pruned only after the new
      # index.html is in place. Nothing outside assets/ is ever deleted.
      - name: Upload to netcup
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/httpdocs/' }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          open --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER"
          mirror --reverse --no-perms --verbose dist/assets "${FTP_SERVER_DIR}assets"
          mirror --reverse --no-perms --verbose --exclude ^assets/ dist "$FTP_SERVER_DIR"
          mirror --reverse --no-perms --verbose --delete dist/assets "${FTP_SERVER_DIR}assets"
          bye
          EOF

      - name: Upload skipped
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret is not set — built the site but skipped the upload."
