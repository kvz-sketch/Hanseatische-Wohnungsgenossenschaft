# Builds the marketing dashboard and uploads dist/ to Hostinger over FTPS (lftp)
# on every push to the dashboard branch. The site behind it serves both
# marketing.gerlach-group.de (Hostinger website gerlach-group.de; the dashboard
# is only used through the marketing subdomain).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HOSTINGER_FTP_SERVER    FTP hostname from hPanel → Files → FTP Accounts
#   HOSTINGER_FTP_USERNAME  FTP user of the gerlach-group.de website
#   HOSTINGER_FTP_PASSWORD  password of that FTP user
# Optional:
#   HOSTINGER_FTP_SERVER_DIR  web root as seen by that FTP user, ending in "/"
#                             (default: /public_html/)
#
# Until HOSTINGER_FTP_SERVER is set, the workflow only builds and skips the upload.
#
# Videoplan data, feedback and the edit password live in ~/videoplan-data,
# outside the web root, so a deploy never touches them.
#
# ssl:check-hostname is off below: Hostinger's shared FTP servers present one
# certificate for the whole server, which doesn't match every account's FTP
# hostname. The certificate chain is still verified and the transfer stays
# TLS-encrypted; only the hostname match is skipped.

name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/ecstatic-wozniak-a70vm3
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install lftp
        if: env.FTP_SERVER != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Assets go up before index.html so the live page never points at missing
      # files; stale hashed assets are pruned only after the new index.html is in
      # place. Nothing outside assets/ is ever deleted.
      - name: Upload to Hostinger
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ssl:check-hostname false
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          open --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER"
          mirror --reverse --no-perms --verbose dist/assets "${FTP_SERVER_DIR}assets"
          mirror --reverse --no-perms --verbose --exclude ^assets/ dist "$FTP_SERVER_DIR"
          mirror --reverse --no-perms --verbose --delete dist/assets "${FTP_SERVER_DIR}assets"
          bye
          EOF

      - name: Check the live site
        if: env.FTP_SERVER != ''
        run: |
          expected=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html)
          for url in https://marketing.gerlach-group.de/dashboard; do
            live=$(curl -fsS -H 'Cache-Control: no-cache' "$url" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' || true)
            echo "$url → ${live:-nothing found} (expected $expected)"
            [ "$live" = "$expected" ] || echo "::warning::$url does not serve the new build yet (CDN cache?)"
          done

      - name: Upload skipped
        if: env.FTP_SERVER == ''
        run: echo "::notice::HOSTINGER_FTP_SERVER secret is not set, so the site was built but not uploaded."
