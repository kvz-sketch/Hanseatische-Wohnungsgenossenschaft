<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Geschenk, Feed 1:1</title>
<link rel="stylesheet" href="../ds/tokens/fonts.css">
<link rel="stylesheet" href="../ds/tokens/colors.css">
<link rel="stylesheet" href="../ds/tokens/typography.css">
<link rel="stylesheet" href="../ds/tokens/spacing.css">
<link rel="stylesheet" href="../ds/tokens/effects.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.snow{background-image:radial-gradient(3px 3px at 8% 12%, rgba(255,255,255,.55) 50%, transparent 51%),radial-gradient(2px 2px at 28% 40%, rgba(255,255,255,.5) 50%, transparent 51%),radial-gradient(4px 4px at 46% 18%, rgba(255,255,255,.4) 50%, transparent 51%),radial-gradient(2px 2px at 64% 52%, rgba(255,255,255,.5) 50%, transparent 51%),radial-gradient(3px 3px at 86% 30%, rgba(255,255,255,.4) 50%, transparent 51%);background-size:240px 200px}
.pbtn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:4px;background:#DDB851;color:#141A46;font:600 16px/1.1 Inter,sans-serif;white-space:nowrap}
</style>
</head>
<body>
<div style="position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--gig-navy); color: #FFFFFF; font-family: var(--font-ui);">
  <img src="../../../assets/stadt-hintergrund.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;">
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,16,48,0.95) 0%, rgba(12,16,48,0.88) 45%, rgba(12,16,48,0.40) 72%, rgba(12,16,48,0.15) 100%);"></div>
  <div class="snow" style="position: absolute; inset: 0;"></div>
  <div style="position: absolute; left: 70px; right: 70px; top: 60px; display: flex; justify-content: space-between; align-items: center;">
    <img src="../../../assets/logo-hwg-weiss.png" alt="Hanseatische Wohnungsgenossenschaft · Gerlach Immobilien Gruppe" style="display: block; height: 110px; width: auto;">
    <span style="padding: 12px 24px; border-radius: 999px; background: #9E2B3A; font-size: 20px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Weihnachtsaktion</span>
  </div>
  <div style="position: absolute; left: 70px; top: 310px; width: 520px; display: flex; flex-direction: column; gap: 24px;">
    <span style="font-size: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-400);">Unser Weihnachtsgeschenk an Sie</span>
    <h1 style="margin: 0; font-family: var(--font-ui); font-weight: 700; font-size: 56px; line-height: 1.1; letter-spacing: -0.02em;">Das Hörbuch zum Bestseller. <em style="font-style: normal; color: var(--gold-400);">Gratis.</em></h1>
    <p style="margin: 0; font-size: 26px; line-height: 1.4; color: rgba(255,255,255,0.88);">„Immobilien-Investitionen leicht gemacht“ von Stephan Gerlach. Sicher investieren, mit klarem Plan.</p>
    <div style="zoom: 1.8; align-self: flex-start; margin-top: 8px;">
      <span class="pbtn">Hörbuch gratis sichern</span>
    </div>
  </div>
  <div style="position: absolute; left: 640px; top: 380px;">
    <img src="../../../assets/buch-mockup.png" alt="Buch „Immobilien-Investitionen leicht gemacht“ von Stephan Gerlach" style="display: block; width: 400px; height: auto; filter: drop-shadow(0 30px 36px rgba(0,0,0,0.55));">
    <img src="../../../assets/spiegel-bestseller.png" alt="SPIEGEL-Bestseller" style="position: absolute; left: -28px; bottom: 40px; width: 160px; height: auto; transform: rotate(-6deg); filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));">
    <div style="position: absolute; right: -10px; top: -70px; width: 140px; height: 140px; border-radius: 50%; background: var(--gig-gold); color: var(--gig-navy); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(12deg); box-shadow: 0 8px 20px rgba(0,0,0,0.35);">
      <span style="font-family: var(--font-display); font-weight: 600; font-size: 50px; line-height: 0.9;">0 €</span>
      <span style="margin-top: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;">Gratis</span>
    </div>
  </div>
  <p style="position: absolute; left: 70px; bottom: 40px; margin: 0; font-size: 15px; color: rgba(255,255,255,0.6);">Kostenloses Hörbuch per E-Mail-Download. Keine Anlageberatung.</p>
</div>
</body>
</html>
